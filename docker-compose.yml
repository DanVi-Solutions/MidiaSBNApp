services:
  db:
    image: postgres:16-alpine
    container_name: midiasbn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: midiasbn-api
    restart: unless-stopped
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "3333:3333"
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Lido de apps/web/.env (via `make up` / `--env-file apps/web/.env`) ou do ambiente de CI/CD
        NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_API_HOST:-}
    container_name: midiasbn-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

volumes:
  db_data: